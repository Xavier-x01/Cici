what_to_notice: >
  The front-page headline communicates institutional breakdown in real time.
  Read the language: is it panicked or restrained? How newspapers reported financial
  crisis in 1907 shaped public understanding of what was happening.
  The Panic of 1907 was resolved by J.P. Morgan's private coordination — no Federal
  Reserve existed yet. The institutional response context is absent from the page itself.

what_this_cannot_prove: >
  A newspaper front page cannot prove what actually happened in financial markets
  that day, what ordinary depositors believed or did, or whether the headline
  accurately characterized conditions.
  Newspapers in 1907 were not objective financial reporters; editorial choices shaped
  what "panic" looked like in print.

lecture_connection: >
  The 1907 panic is the chapter's earlier case, predating the Federal Reserve (1913)
  and the regulatory infrastructure built after 1933. It shows the same pressure
  signature (bank runs, institutional cascades, emergency coordination) at a moment
  when the institutional response capacity was weaker. The comparison to the 1929–1933
  period shows how much the response infrastructure changed — and how the pressure
  signature persisted anyway.

