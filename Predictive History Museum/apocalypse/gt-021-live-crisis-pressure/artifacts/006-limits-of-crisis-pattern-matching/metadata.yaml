what_to_notice: >
  This is a curator-authored text, not a historical document.
  Its presence is the exhibit's commitment to epistemic honesty.
  The exhibit has shown you a pressure signature pattern. This artifact names
  what you cannot do with that pattern: treat it as a template for predicting future crises.

what_this_cannot_prove: >
  A caution text cannot resolve the problems it names — it can only name them honestly.

lecture_connection: >
  The chapter identifies crisis pressure patterns across two historical cases.
  This caution closes the exhibit by specifying the exact error the chapter is designed
  to prevent: using pattern recognition to generate false certainty about future events.
  Pattern families are not laws. Resemblance is not identity.

curator_note: >
  Every exhibit requires a caution_room artifact. This one must address the specific
  methodological risk of the Apocalypse book's overall project: identifying patterns in
  historical crises and using them to analyze present and future conditions.
  The caution text (300–500 words) must be written by a human curator and placed in
  original/caution-crisis-pattern-matching.md. It should name the specific errors
  that crisis pattern-matching produces and explain why the chapter's method does not
  claim to eliminate them.
