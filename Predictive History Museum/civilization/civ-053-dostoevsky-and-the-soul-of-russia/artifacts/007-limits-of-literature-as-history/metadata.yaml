what_to_notice: >
  This is a curator-authored text, not a historical document.
  Its presence is the exhibit's most important act of intellectual honesty:
  the museum acknowledges what its own exhibits cannot establish.

what_this_cannot_prove: >
  A caution text cannot itself resolve the methodological problems it names.
  It can only name them honestly.

lecture_connection: >
  The chapter uses literature as civilizational evidence. This caution artifact
  closes the exhibit by making explicit what the chapter's methodology cannot
  deliver: proof. It can offer illumination, pattern recognition, and interpretive
  frameworks — not evidentiary certainty.

