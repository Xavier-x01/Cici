what_to_notice: >
  The eyes — looking past the viewer, not at them. This is the canonical Dostoevsky:
  intense, inward, not performing for an audience.
  The hands are not shown; the figure is cropped to head and chest, isolating the face.
  Perov painted him in the same year as The Possessed — this is the man in full crisis.

what_this_cannot_prove: >
  A portrait cannot reveal inner states. Perov's artistic choices shaped this image
  as much as Dostoevsky's appearance did. This is how one painter saw him in one session,
  not an objective record. Dostoevsky's own accounts of his appearance and manner
  differ from how others described him.

lecture_connection: >
  The portrait grounds the chapter in a specific person, not an abstraction. Before
  the chapter makes claims about "Dostoevsky's diagnosis of Russian civilization,"
  the visitor needs to see the man: aged, epileptic, recently returned from Siberian
  exile, writing against deadline. The context makes the diagnosis credible.

curator_note: >
  The Perov portrait is the most reproduced and most authoritative likeness — painted
  with Dostoevsky's cooperation at the peak of his career. Placed in context_room
  rather than entrance because the sound of the tradition (001) must precede the man
  who wrestled with it.
