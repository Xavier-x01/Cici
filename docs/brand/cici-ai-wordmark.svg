<?xml version="1.0" encoding="UTF-8"?>
<!--
  cici-ai wordmark / social header variant
  Canvas: 1500×500 (3:1 — suits X/Twitter header, YouTube channel art crop, Locals banner)
  Uses same mark + typeset name so the identity extends without redesigning.

  Reuse rule: same color palette as avatar. Do not introduce new colors without operator approval.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1500 500"
  width="1500"
  height="500"
>
  <!-- Background -->
  <rect width="1500" height="500" fill="#1A1D2E"/>

  <!-- Mark (avatar, scaled to 320×320, centered vertically at x=90) -->
  <g transform="translate(90,90) scale(0.3125)">
    <!-- Outer ring -->
    <circle cx="512" cy="512" r="460" fill="none" stroke="#3ECFCF" stroke-width="18" opacity="0.35"/>
    <!-- C letterform -->
    <path
      d="M 690 268 A 310 310 0 1 0 690 756 L 690 672 A 224 224 0 1 1 690 352 Z"
      fill="#FFFFFF"
    />
    <!-- Node glow -->
    <circle cx="690" cy="512" r="52" fill="#3ECFCF" opacity="0.25"/>
    <!-- Node body -->
    <circle cx="690" cy="512" r="36" fill="#3ECFCF"/>
    <!-- Spark -->
    <circle cx="690" cy="512" r="16" fill="#F0C040"/>
  </g>

  <!-- Wordmark text -->
  <!-- "cici" in white, large -->
  <text
    x="440"
    y="290"
    font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="210"
    font-weight="700"
    letter-spacing="-6"
    fill="#FFFFFF"
  >cici</text>

  <!-- "-ai" in teal, slightly smaller, baseline-aligned -->
  <text
    x="870"
    y="290"
    font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="210"
    font-weight="300"
    fill="#3ECFCF"
  >-ai</text>

  <!-- Tagline -->
  <text
    x="442"
    y="360"
    font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="52"
    font-weight="400"
    fill="#3ECFCF"
    opacity="0.70"
    letter-spacing="2"
  >Open Brain · hobbyist mutual help</text>
</svg>
